<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IshaDashboard1018</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #07090E; color: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .period-tab { padding: 1px 3px; font-size: 8px; font-weight: 700; cursor: pointer; color: #64748B; border-bottom: 2px solid transparent; }
        .period-tab.active { color: #38BDF8; border-bottom-color: #38BDF8; }
        .panel-card { background: #0D111A; border: 1px solid #1E293B; border-radius: 10px; padding: 12px; }
        @keyframes marqueeScroll { 0% { transform: translateX(0%); } 100% { transform: translateX(-50%); } }
        .marquee-track { display: flex; width: -moz-max-content; width: max-content; animation: marqueeScroll 22s linear infinite; }
        .marquee-track:hover { animation-play-state: paused; }
        @keyframes pulseBlink { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
        .blink-badge { animation: pulseBlink 1.2s infinite ease-in-out; }
    </style>
</head>
<body class="p-2 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MiniBarChart = ({ title, value, color, period, setPeriod, bars }) => (
            <div className="bg-[#090D14] border border-[#1E293B] rounded-lg p-2.5 mb-2.5">
                <div className="flex justify-between items-center text-[10px] font-bold mb-1">
                    <span className="text-slate-400 uppercase tracking-wider">{title}</span>
                    <span className={color}>{value}</span>
                </div>
                <div className="flex justify-between border-b border-[#1E293B] pb-1 mb-2">
                    {['1D', '5D', '1M', '6M', 'YTD', '1Y', '5Y', 'Max'].map(p => (
                        <span key={p} onClick={() => setPeriod(p)} className={`period-tab ${period === p ? 'active' : ''}`}>{p}</span>
                    ))}
                </div>
                <div className="flex items-end gap-1 h-10 pt-1">
                    {bars.map((h, i) => (
                        <div key={i} className="flex-1 rounded-t-sm" style={{ height: `${h}%`, background: color.includes('emerald') || color.includes('sky') ? 'linear-gradient(to top, #0284C7, #38BDF8)' : 'linear-gradient(to top, #C026D3, #E879F9)' }}></div>
                    ))}
                </div>
            </div>
        );

        const HorizontalBar = ({ label, value, percent, color }) => (
            <div className="flex items-center justify-between text-[10px] py-1">
                <span className="text-slate-300 w-24 truncate">{label}</span>
                <div className="flex-1 mx-2 bg-slate-800 rounded-full h-1.5 overflow-hidden">
                    <div className={`h-full rounded-full ${color}`} style={{ width: `${percent}%` }}></div>
                </div>
                <span className={`font-mono ${value.startsWith('+') ? 'text-emerald-400' : 'text-amber-400'}`}>{value}</span>
            </div>
        );

        const App = () => {
            const [selectedBot, setSelectedBot] = useState('crypto');
            const [superIntel, setSuperIntel] = useState(true);
            const [activeNav, setActiveNav] = useState('overview');
            const [refreshing, setRefreshing] = useState(false);
            const [tickerQuery, setTickerQuery] = useState('');
            const [tickerSuggestions, setTickerSuggestions] = useState([]);
            
            // Selected search stock for dynamic chart below search bar
            const [searchedStock, setSearchedStock] = useState(null);
            const [searchChartPeriod, setSearchChartPeriod] = useState('1D');

            // Independent states for each bot page: crypto, us_trading, zerodha
            const [botStates, setBotStates] = useState({
                crypto: { status: 'STOPPED', buyBlocked: 'ON' },
                us_trading: { status: 'STOPPED', buyBlocked: 'ON' },
                zerodha: { status: 'STOPPED', buyBlocked: 'ON' }
            });
            
            const [unrMsg, setUnrMsg] = useState([
                { id: 1, time: '2026-10-17 07:35:12', source: 'Robinhood.com', text: 'Order filled: Buy 14.21 NEAR-USD @ $5.08 limit execution confirmed.' },
                { id: 2, time: '2026-10-17 07:30:00', source: 'Robinhood.com', text: 'Liquidity alert: Available buying power successfully synchronized.' }
            ]);
            const [allMsg, setAllMsg] = useState([
                { id: 1, time: '2026-10-17 07:35:12', source: 'Robinhood.com', text: 'Order filled: Buy 14.21 NEAR-USD @ $5.08 limit execution confirmed.' },
                { id: 2, time: '2026-10-17 07:30:00', source: 'Robinhood.com', text: 'Liquidity alert: Available buying power successfully synchronized.' }
            ]);

            // BCU_V1: server-driven bot state, Stop BUY and messages (no local source of truth)
            React.useEffect(() => {
                let on = true;
                const get = async (u) => { const r = await fetch(u, { credentials: 'same-origin', cache: 'no-store' }); const x = await r.json().catch(() => ({})); if (!r.ok) { const e = new Error(x.error || ('HTTP ' + r.status)); e.status = r.status; throw e; } return x; };
                const load = async () => {
                    try {
                        const [c, s, m] = await Promise.all([get('/api/buy-controls'), get('/api/bot-live-status'), get('/api/messages')]);
                        if (!on) return;
                        setBotStates(prev => { const n = { ...prev }; ['crypto', 'us_trading', 'zerodha'].forEach(b => { n[b] = { ...prev[b], buyBlocked: c.state.bots[b].enabled === true ? 'OFF' : 'ON', status: s.bots[b].running ? 'RUNNING' : 'STOPPED' }; }); return n; });
                        setAllMsg(m.messages); setUnrMsg(m.unread_messages);
                    } catch (e) { if (e.status === 401 && window.__showLogin) window.__showLogin(); }
                };
                window.__refresh = load; load();
                const id = setInterval(load, 5000);
                return () => { on = false; clearInterval(id); };
            }, []);
            const [p1, setP1] = useState('1D');
            const [p2, setP2] = useState('1D');
            const [p3, setP3] = useState('5D');

            const [liveTickers, setLiveTickers] = useState([]);


            // Live market ticker feed; quotes come from the existing market API.
            useEffect(() => {
                let cancelled = false;
                let timer;
                const botKey = String(selectedBot || '').toLowerCase();
                const symbols = botKey.includes('crypto')
                    ? ['BTC-USD', 'ETH-USD', 'SOL-USD', 'DOGE-USD', 'XRP-USD', 'NEAR-USD']
                    : (botKey.includes('zerodha') || botKey.includes('india')
                        ? ['RELIANCE.NS', 'TCS.NS', 'INFY.NS', 'HDFCBANK.NS', 'ICICIBANK.NS', 'SBIN.NS']
                        : ['AAPL', 'MSFT', 'NVDA', 'AMZN', 'META', 'TSLA']);

                const refreshLiveTickers = async () => {
                    const results = await Promise.all(symbols.map(async symbol => {
                        try {
                            const response = await fetch(
                                '/api/world-market/chart?symbol=' +
                                encodeURIComponent(symbol) + '&period=day',
                                { cache: 'no-store' }
                            );
                            if (!response.ok) return null;
                            const payload = await response.json();
                            const chart = payload?.data?.chart?.result?.[0];
                            if (!chart) return null;

                            const meta = chart.meta || {};
                            const quote = chart.indicators?.quote?.[0] || {};
                            const closes = (quote.close || []).filter(
                                value => typeof value === 'number' && Number.isFinite(value)
                            );
                            const price = Number(meta.regularMarketPrice) || closes[closes.length - 1];
                            const previous = Number(meta.chartPreviousClose) ||
                                Number(meta.previousClose) || closes[0];
                            if (!Number.isFinite(price) || !Number.isFinite(previous) || previous === 0) return null;

                            const change = ((price - previous) / previous) * 100;
                            const currency = meta.currency || (symbol.endsWith('.NS') ? 'INR' : 'USD');
                            const formatted = new Intl.NumberFormat('en-US', {
                                style: 'currency',
                                currency,
                                maximumFractionDigits: price < 10 ? 4 : 2
                            }).format(price);

                            return {
                                symbol,
                                price: formatted,
                                change: (change >= 0 ? '+' : '') + change.toFixed(2) + '%',
                                bullish: change >= 0
                            };
                        } catch (_) {
                            return null;
                        }
                    }));

                    if (!cancelled) setLiveTickers(results.filter(Boolean));
                };

                refreshLiveTickers();
                timer = setInterval(refreshLiveTickers, 60000);
                return () => {
                    cancelled = true;
                    clearInterval(timer);
                };
            }, [selectedBot]);


            // Search suggestions are retrieved from the live market API.
            useEffect(() => {
                let cancelled = false;
                const query = tickerQuery.trim();

                if (!query) {
                    setTickerSuggestions([]);
                    return () => { cancelled = true; };
                }

                const timer = setTimeout(async () => {
                    try {
                        const response = await fetch(
                            '/api/world-market/search?q=' + encodeURIComponent(query),
                            { cache: 'no-store' }
                        );
                        if (!response.ok) throw new Error('Search request failed');

                        const payload = await response.json();
                        const data = payload?.data || payload || {};
                        const quotes = data.quotes || data.results || [];
                        const filtered = quotes.filter(item => String(item.symbol || '').trim()).slice(0, 10).map(item => ({
                            symbol: item.symbol,
                            name: item.shortname || item.longname || item.symbol,
                            price: 'Select for live quote',
                            change: '',
                            bullish: true
                        }));

                        if (!cancelled) setTickerSuggestions(filtered);
                    } catch (_) {
                        if (!cancelled) setTickerSuggestions([]);
                    }
                }, 300);

                return () => {
                    cancelled = true;
                    clearTimeout(timer);
                };
            }, [tickerQuery, selectedBot]);

            const handleFullRefresh = () => {
                setRefreshing(true);
                Promise.resolve()
                    .then(() => {
                        return Promise.all([
                            typeof window.__refresh === 'function'
                                ? window.__refresh() : Promise.resolve(),
                            typeof window.__refreshPortfolio === 'function'
                                ? window.__refreshPortfolio() : Promise.resolve()
                        ]);
                    })
                    .catch((error) => {
                        console.error('Dashboard refresh failed:', error);
                    })
                    .finally(() => {
                        setTimeout(() => setRefreshing(false), 700);
                    });
            };

            const handleTickerInput = (e) => {
                setTickerQuery(e.target.value);
            };

            const selectTicker = async (item) => {
                setTickerQuery('');
                setTickerSuggestions([]);
                setSearchedStock({
                    ...item,
                    price: 'Loading live quote...',
                    change: '',
                    bullish: true
                });

                try {
                    const response = await fetch(
                        '/api/world-market/chart?symbol=' +
                        encodeURIComponent(item.symbol) + '&period=day',
                        { cache: 'no-store' }
                    );
                    if (!response.ok) throw new Error('Quote request failed');

                    const payload = await response.json();
                    const chart = payload?.data?.chart?.result?.[0];
                    if (!chart) throw new Error('No quote data');

                    const meta = chart.meta || {};
                    const closes = (chart.indicators?.quote?.[0]?.close || [])
                        .filter(v => typeof v === 'number' && Number.isFinite(v));
                    const price = Number(meta.regularMarketPrice) ||
                        closes[closes.length - 1];
                    const previous = Number(meta.chartPreviousClose) ||
                        Number(meta.previousClose) || closes[0];

                    if (!Number.isFinite(price)) throw new Error('No current price');

                    const currency = meta.currency ||
                        (item.symbol.endsWith('.NS') || item.symbol.endsWith('.BO') ? 'INR' : 'USD');
                    const formatted = new Intl.NumberFormat('en-US', {
                        style: 'currency',
                        currency,
                        maximumFractionDigits: price < 10 ? 4 : 2
                    }).format(price);

                    const change = Number.isFinite(previous) && previous !== 0
                        ? ((price - previous) / previous) * 100
                        : null;

                    setSearchedStock({
                        ...item,
                        price: formatted,
                        change: change === null ? 'Change unavailable' :
                            (change >= 0 ? '+' : '') + change.toFixed(2) + '%',
                        bullish: change === null ? true : change >= 0
                    });
                } catch (error) {
                    setSearchedStock({
                        ...item,
                        price: 'Live quote unavailable',
                        change: '',
                        bullish: true
                    });
                }
            };

            const [liveProfiles, setLiveProfiles] = useState({});

            const botProfiles = {
                crypto: {
                    name: 'Crypto Bot',
                    portal: 'Robinhood.com',
                    funds: '$94.10',
                    realized: '+$24.50 (+26.04%)',
                    unrealized: '+$8.18 (+11.75%)',
                    totalValue: '$77.78',
                    holdingsTitle: 'CRYPTO Active Holdings - Live Stream (Robinhood.com)',
                    holdings: [
                        { asset: 'NEAR-USD', shares: '14.21', buyPrice: '$5.08', currPrice: '$4.78', diff: '-$0.3000', invested: '$72.1', fee: '$0.15', currVal: '$67.92', totalDiff: '-$4.18' },
                        { asset: 'BTC-USD', shares: '0.00005973', buyPrice: '$83500', currPrice: '$81760.77', diff: '-$1739.2300', invested: '$4.99', fee: '$0.02', currVal: '$4.88', totalDiff: '-$0.11' },
                        { asset: 'XLM-USD', shares: '1', buyPrice: '$0.19', currPrice: '$0.1834', diff: '-$0.0066', invested: '$0.19', fee: '$0.01', currVal: '$0.18', totalDiff: '-$0.01' }
                    ],
                    closedTrades: [
                        { time: '2026-10-13 18:38', symbol: 'NEAR-USD', type: 'SELL +5% NP', qty: '12.8', invested: '$26.18', sold: '$27.52', pnl: '+$14.85' },
                        { time: '2026-10-12 14:15', symbol: 'SOL-USD', type: 'SELL +5% NP', qty: '0.45', invested: '$77.63', sold: '$81.54', pnl: '+$8.40' },
                        { time: '2026-10-11 09:18', symbol: 'BTC-USD', type: 'SELL -1% Loss', qty: '0.0001', invested: '$6.68', sold: '$6.61', pnl: '-$1.25' }
                    ]
                },
                us_trading: {
                    name: 'US Trading Bot',
                    portal: 'Robinhood.com',
                    funds: '$1,450.00',
                    realized: '+$112.30 (+8.40%)',
                    unrealized: '+$45.20 (+3.10%)',
                    totalValue: '$1,607.50',
                    holdingsTitle: 'US TRADING Active Holdings - Live Stream (Robinhood.com)',
                    holdings: [
                        { asset: 'NVDA', shares: '5.00', buyPrice: '$132.50', currPrice: '$138.20', diff: '+$5.7000', invested: '$662.50', fee: '$0.50', currVal: '$691.00', totalDiff: '+$28.50' },
                        { asset: 'TSLA', shares: '3.00', buyPrice: '$225.00', currPrice: '$218.50', diff: '-$6.5000', invested: '$675.00', fee: '$0.50', currVal: '$655.50', totalDiff: '-$19.50' }
                    ],
                    closedTrades: [
                        { time: '2026-10-13 15:45', symbol: 'AAPL', type: 'SELL +3% NP', qty: '4.00', invested: '$880.00', sold: '$906.40', pnl: '+$26.40' }
                    ]
                },
                zerodha: {
                    name: 'Zerodha Bot',
                    portal: 'India (Zerodha.com)',
                    funds: '₹45,200.00',
                    realized: '+₹3,450.00 (+7.60%)',
                    unrealized: '+₹1,210.00 (+2.70%)',
                    totalValue: '₹49,860.00',
                    holdingsTitle: 'ZERODHA Active Holdings - Live Stream (India)',
                    holdings: [
                        { asset: 'RELIANCE', shares: '10', buyPrice: '₹2,880.00', currPrice: '₹2,940.00', diff: '+₹60.00', invested: '₹28,800', fee: '₹15.00', currVal: '₹29,400', totalDiff: '+₹600.00' },
                        { asset: 'TCS', shares: '5', buyPrice: '₹4,150.00', currPrice: '₹4,120.00', diff: '-₹30.00', invested: '₹20,750', fee: '₹12.00', currVal: '₹20,600', totalDiff: '-₹150.00' }
                    ],
                    closedTrades: [
                        { time: '2026-10-13 14:10', symbol: 'INFY', type: 'SELL +4% Target', qty: '15', invested: '₹22,500', sold: '₹23,400', pnl: '+₹900.00' }
                    ]
                }
            };


            React.useEffect(() => {
                let active = true;

                const number = (value) => {
                    if (value === null || value === undefined || value === '') return null;
                    const n = Number(value);
                    return Number.isFinite(n) ? n : null;
                };

                const money = (value, currency) => {
                    const n = number(value);
                    if (n === null) return 'Unavailable';
                    return new Intl.NumberFormat(
                        currency === 'INR' ? 'en-IN' : 'en-US',
                        { style: 'currency', currency, maximumFractionDigits: 2 }
                    ).format(n);
                };

                const signedMoney = (value, currency) => {
                    const n = number(value);
                    if (n === null) return 'Unavailable';
                    return (n > 0 ? '+' : n < 0 ? '-' : '') +
                        money(Math.abs(n), currency);
                };

                const percent = (value, base) => {
                    const n = number(value);
                    const b = number(base);
                    if (n === null || b === null || b === 0) return '';
                    return ` (${n / Math.abs(b) * 100 >= 0 ? '+' : ''}${(n / Math.abs(b) * 100).toFixed(2)}%)`;
                };

                const unavailable = (name, portal, title) => ({
                    name, portal,
                    funds: 'Unavailable',
                    realized: 'Unavailable',
                    unrealized: 'Unavailable',
                    totalValue: 'Unavailable',
                    holdingsTitle: title,
                    holdings: [],
                    closedTrades: []
                });

                const loadPortfolio = async () => {
                    try {
                        const response = await fetch('/api/dashboard-data', {
                            credentials: 'same-origin',
                            cache: 'no-store'
                        });
                        if (!response.ok) {
                            throw new Error('Portfolio API returned HTTP ' + response.status);
                        }

                        const payload = await response.json();
                        const data = payload.data || {};
                        const profiles = {
                            crypto: unavailable(
                                'Crypto Bot', 'Robinhood.com',
                                'CRYPTO Holdings — live account integration unavailable'
                            ),
                            us_trading: unavailable(
                                'US Trading Bot', 'Robinhood.com',
                                'US STOCKS Holdings — account data unavailable'
                            ),
                            zerodha: unavailable(
                                'Zerodha Bot', 'India (Zerodha.com)',
                                'ZERODHA Holdings — snapshot unavailable'
                            )
                        };

                        const stocks = data.stocks && data.stocks.available
                            ? data.stocks.data : null;

                        if (stocks && typeof stocks === 'object') {
                            const cash = number(stocks.cash);
                            const positions = Object.entries(stocks.positions || {});
                            let marketValue = 0;
                            let unrealized = 0;
                            let complete = cash !== null;
                            const holdings = positions.map(([symbol, p]) => {
                                const qty = number(p.quantity);
                                const entry = number(p.entry_price);
                                const last = number(p.last_price);
                                const invested = number(p.total_cost) ??
                                    (qty !== null && entry !== null ? qty * entry : null);
                                const value = qty !== null && last !== null ? qty * last : null;
                                const diff = entry !== null && last !== null ? last - entry : null;
                                const pnl = qty !== null && diff !== null ? qty * diff : null;

                                if (value === null || pnl === null) complete = false;
                                if (value !== null) marketValue += value;
                                if (pnl !== null) unrealized += pnl;

                                return {
                                    asset: symbol,
                                    shares: qty === null ? 'Unavailable' : String(qty),
                                    buyPrice: money(entry, 'USD'),
                                    currPrice: money(last, 'USD'),
                                    diff: signedMoney(diff, 'USD'),
                                    invested: money(invested, 'USD'),
                                    fee: money(p.entry_fee, 'USD'),
                                    currVal: money(value, 'USD'),
                                    totalDiff: signedMoney(pnl, 'USD')
                                };
                            });

                            const realized = number(stocks.realized_pnl);
                            const starting = number(stocks.starting_cash);
                            const realizedText = realized === null
                                ? 'Unavailable'
                                : signedMoney(realized, 'USD') + percent(realized, starting);
                            const unrealizedText = complete
                                ? signedMoney(unrealized, 'USD') +
                                  percent(unrealized, positions.reduce((sum, [, p]) =>
                                      sum + (number(p.total_cost) ?? 0), 0))
                                : 'Unavailable';

                            const rows = data.stock_trades &&
                                data.stock_trades.available &&
                                Array.isArray(data.stock_trades.rows)
                                ? data.stock_trades.rows : [];

                            const first = (row, keys) => {
                                for (const key of keys) {
                                    if (row[key] !== undefined && row[key] !== '') return row[key];
                                }
                                return '—';
                            };

                            profiles.us_trading = {
                                name: 'US Trading Bot',
                                portal: 'Robinhood.com',
                                funds: money(cash, 'USD'),
                                realized: realizedText,
                                unrealized: unrealizedText,
                                totalValue: cash !== null && complete
                                    ? money(cash + marketValue, 'USD') : 'Unavailable',
                                holdingsTitle: 'US STOCKS Account Snapshot' +
                                    (data.stocks.source_modified
                                        ? ' — source updated ' + data.stocks.source_modified : ''),
                                holdings,
                                closedTrades: rows.map(row => ({
                                    time: first(row, ['time', 'timestamp', 'created', 'entry_time']),
                                    symbol: first(row, ['symbol', 'ticker', 'asset']),
                                    type: first(row, ['type', 'side', 'action', 'reason']),
                                    qty: first(row, ['quantity', 'qty', 'shares']),
                                    invested: first(row, ['invested', 'cost_basis', 'buy_value']),
                                    sold: first(row, ['sold', 'proceeds', 'sell_value']),
                                    pnl: String(first(row, ['pnl', 'realized_pnl', 'profit_loss']))
                                }))
                            };
                        }

                        const z = data.zerodha && data.zerodha.available
                            ? data.zerodha.data : null;

                        if (z && typeof z === 'object') {
                            const rows = Array.isArray(z.holdings) ? z.holdings : [];
                            let unrealized = 0;
                            let pnlComplete = rows.length > 0;

                            const holdings = rows.map(h => {
                                const qty = number(h.quantity);
                                const avg = number(h.average_price);
                                const last = number(h.last_price);
                                const pnl = number(h.pnl);
                                if (pnl === null) pnlComplete = false;
                                else unrealized += pnl;

                                return {
                                    asset: h.tradingsymbol || '—',
                                    shares: qty === null ? 'Unavailable' : String(qty),
                                    buyPrice: money(avg, 'INR'),
                                    currPrice: money(last, 'INR'),
                                    diff: signedMoney(
                                        avg !== null && last !== null ? last - avg : null,
                                        'INR'
                                    ),
                                    invested: money(
                                        qty !== null && avg !== null ? qty * avg : null,
                                        'INR'
                                    ),
                                    fee: 'Unavailable',
                                    currVal: money(
                                        qty !== null && last !== null ? qty * last : null,
                                        'INR'
                                    ),
                                    totalDiff: signedMoney(pnl, 'INR')
                                };
                            });

                            const paper = z.mode === 'PAPER' || z.read_only === true;
                            profiles.zerodha = {
                                name: 'Zerodha Bot',
                                portal: 'India (Zerodha.com)',
                                funds: paper ? 'Not verified — PAPER/read-only' : 'Unavailable',
                                realized: 'Unavailable — not supplied by this snapshot',
                                unrealized: pnlComplete
                                    ? signedMoney(unrealized, 'INR') : 'Unavailable',
                                totalValue: 'Unavailable — account total not verified',
                                holdingsTitle: 'ZERODHA ' +
                                    (paper ? 'PAPER / READ-ONLY SNAPSHOT' : 'Reconciliation Snapshot') +
                                    (z.timestamp_utc ? ' — ' + z.timestamp_utc : ''),
                                holdings,
                                closedTrades: []
                            };
                        }

                        if (active) setLiveProfiles(profiles);

        style: { width: 25, height: 13, borderRadius: 7, border: '1px solid rgba(255,255,255,.25)', padding: 0, position: 'relative', background: col,
                 cursor: pending ? 'wait' : 'pointer', opacity: pending ? 0.6 : 1, flex: '0 0 auto' } },
        h('span', { style: { position: 'absolute', top: 1, left: state ? 13 : 1, width: 9, height: 9, borderRadius: '50%', background: '#fff', transition: 'left 0.15s' } }));
      return h('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
        h('span', { style: { color: '#cbd5e1', fontSize: 10, fontWeight: 800, width: 26 } }, label), btn,
        h('span', { style: { color: col, fontSize: 10, fontWeight: 800, minWidth: 20 } }, state ? 'ON' : 'OFF'));
    }

    var botStatusText = s.bot ? 'RUNNING_STREAMING' : 'STOPPED';
    var botStatusCol = s.bot ? '#10b981' : '#dc2626';

    return h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', gap: 16 } },
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 24 } },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4 } },
          sw('BUY', s.buy, busy === 'buy', onBuy, 'Toggle automatic BUY'),
          sw('SELL', s.sell, busy === 'sell', onSell, 'Toggle automatic SELL')
        ),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 3 } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: '#94a3b8' } },
            h('span', { style: { width: 6, height: 6, borderRadius: '50%', background: '#10b981', display: 'inline-block' } }),
            h('span', { style: { fontWeight: 'bold' } }, 'Portal:'),
            h('span', { style: { color: '#38bdf8', fontWeight: 'bold' } }, portalText)
          ),
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: '#94a3b8' } },
            h('span', { style: { fontWeight: 'bold' } }, 'Status:'),
            h('span', { style: { color: botStatusCol, fontWeight: 'bold' } }, botStatusText)
          )
        )
      ),
      h('div', { style: { display: 'flex', alignItems: 'center' } },
        sw('BOT', s.bot, busy === 'bot', onBot, 'Toggle PM2 Process')
      )
    );
  };
})();

</script>
</body>
